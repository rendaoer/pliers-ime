[workspace]
resolver = "3"
members = ["crates/*"]
# 直接 `cargo run` 就跑主程序，不用写 -p
default-members = ["crates/pliers-ime"]

[workspace.package]
version = "0.2.1"
edition = "2024"
# 发布到 crates.io 必填。代码是 MIT/Apache 双许可；**词库资产**是另一回事
#（它是 GPL-3.0 语料 rime-frost 的衍生作品，见 docs/dictionary.md）
license = "MIT OR Apache-2.0"
repository = "https://github.com/rendaoer/pliers-ime"
keywords = ["input-method", "wayland", "ime", "pinyin", "chinese"]

# 发布版的编译选项。默认的 release 会留着符号表、也不做跨 crate 优化，
# 实测（turso 这个依赖树）：22.9 MB → 13.9 MB
#   strip          去掉符号表，省 ~4.6 MB（二进制里没人看那些名字）
#   lto + cu=1     跨 crate 内联、整个程序当一个编译单元，省 ~4 MB
# 代价是编译慢一点（~1 分钟 → ~3 分钟），`cargo install` 装的用户也吃这一份
[profile.release]
lto = true
codegen-units = 1
strip = true

[workspace.dependencies]
wayland-client = "0.31"
wayland-protocols-misc = { version = "0.3", features = ["client"] }
xkbcommon = "0.7"

# 内部依赖：path 是开发用的，version 是发布用的。**两个都得写** ——
# 发布时 cargo 会把 path 去掉、只留 version，不然 `cargo publish` 直接报
# "all dependencies must have a version requirement specified"。
# 注意 `version.workspace = true` 在这里不支持（cargo 只认字面量），
# 所以改版本号时 [workspace.package] 和这三行要一起改
pliers-engine = { version = "0.2.1", path = "crates/pliers-engine" }
pliers-popup = { version = "0.2.1", path = "crates/pliers-popup" }
pliers-wayland = { version = "0.2.1", path = "crates/pliers-wayland" }
