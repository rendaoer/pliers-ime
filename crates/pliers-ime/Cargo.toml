[package]
name = "pliers-ime"
description = "pliers：一个从零手写的 Wayland 中文输入法（全拼/双拼，SQLite 词库，TOML 配置）"
version.workspace = true
edition.workspace = true

[[bin]]
# 包名要避让 crates.io 上的 pliers（已被占），但命令还是短的
name = "pliers"
path = "src/main.rs"

[dependencies]
pliers-engine.workspace = true
pliers-wayland.workspace = true
# 交互式设置要动 termios（原始模式），还有 poll 等 fd
libc = "0.2"
