[package]
name = "ime-popup"
description = "候选框长什么样：尺寸、像素、共享内存（纯逻辑，不碰 Wayland）"
version.workspace = true
edition.workspace = true

[dependencies]
# 画字用：ab_glyph 只做"字符 → 轮廓 → 灰度图"，不带排版和字体发现
ab_glyph = "0.2"
# 找系统字体（它认识 .ttc 里的每一个字面，也认识 ~/.local/share/fonts）
# 关掉 fontconfig 特性：不想为了列个字体目录去链接 libfontconfig
fontdb = { version = "0.24", default-features = false, features = ["std", "fs", "memmap"] }
ime-engine.workspace = true

[dev-dependencies]
# 只给 examples/dump_popup.rs 用：把候选框存成 PNG，不用真跑输入法也能看长相
png = "0.18"
