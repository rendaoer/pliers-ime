# pliers 配置示例
#
# 复制到 ~/.config/pliers/config.toml 就会生效（也可以放在别处，
# 用 PLIERS_CONFIG=/path/to/config.toml 指过去）。删掉这个文件也能跑，用内置默认值。
#
# 改完不用重启：`pliers reload` 让正在跑的实例重新读一遍。
# 想临时试试某项（不写文件）：`pliers set scheme.kind double-pinyin`、`pliers status` 看现状。

# ---- 输入方案 ---------------------------------------------------------------
[scheme]
# full-pinyin    全拼：nihao + 空格 → 你好
# double-pinyin  双拼：两键一个音节，nihc（自然码）→ 你好
# table          码表方案：五笔、郑码、仓颉这类"键本身就是码"的
kind = "full-pinyin"

# 双拼键位，只在 kind = "double-pinyin" 时看：
#   natural = 自然码（搜狗/QQ 拼音默认）   flypy = 小鹤   mspy = 微软双拼
#   none    = 空表，键位全靠下面的 [scheme.keys] 自己写
# layout = "natural"

# 自定义键位。[scheme.keys] 写在预设**之上**：只改一个键就只写那一个；
# layout = "none" 时它就是全部键位。名字写 zh/ch/sh 是声母，别的都当韵母。
# [scheme.keys]
# ao = "c"      # 把 ao 从 k 挪到 c（小鹤的位置）
# zh = "v"

# 码表在词库里的名字，只在 kind = "table" 时看。
# 码表要用 pliers-dict 导进去：--table 码表.txt --table-scheme wubi
# name = "wubi"

# 整句候选：库里没有整词时，把音节切成词拼一句（nihaoma → 你好吗）。
# 全拼、双拼都有，默认开。想要"只出词库里真有的词"就设 false
# sentence = true

# ---- 中英文切换 -------------------------------------------------------------
[engine]
# 切换键，可以写多个：
#   "ctrl+space"  Ctrl+空格（中文输入法的老习惯）
#   "shift"       轻按一下 Shift（按下到抬起之间没按别的键才算）
# 空数组 [] = 不要切换键（那就一直是中文）
# toggle_keys = ["ctrl+space", "shift"]

# 启动时用哪种模式：chinese / english
# start_mode = "chinese"

# 切换时在光标处弹一下「中」/「英」（复用候选框）
# indicator = true

# 中文标点：中文模式下把半角标点打成全角（, → ， / . → 。 / ? → ？ …）。
# 关掉就老老实实打半角；英文模式下永远是半角
# chinese_punctuation = true

# ---- 词库 -------------------------------------------------------------------
[dict]
# SQLite 词库文件（用 pliers-dict 生成，见 README）
# path = "~/.local/share/pliers/dict.db"

# 候选框一页显示几个（数字键 1-9 选的是这一页的第几个）
# max_candidates = 9

# 一次准备多少个候选 = 最多能翻多少页（90 就是 10 页）。
# 翻页：← → ↑ ↓ 挪选中（挪出这一页自动翻页）、, . 或 - = 或 PgUp/PgDn 整页翻
# pool_size = 90
