# 构建**两个**资产，挂到 Release 上：
#   pinyin.db.zst    拼音词库（86 MB → 27 MB），pliers --init 下载它
#   english.db.zst   英文候选词表（SQLite，25k 词 → 约 500 KB），pliers fetch english 下载它
# 两者分开，是为了能各自独立更新：换词表不用重发词库，反之亦然。
# （五笔这类码表**不进这里**：各家的码不一样、许可也各不相同，用户自己
#  pliers build wubi <码表.txt> 建到 wubi.db 里）
#
# 为什么走 Release 而不是直接进仓库：词库是几百 MB 的派生物，GitHub 单文件上限 100 MB，
# 而且每次重新导入都会产生一堆二进制 diff。`pliers --init` 就是从这个地址拿的：
#
#   https://github.com/<owner>/<repo>/releases/latest/download/pinyin.db.zst
#   （releases/latest/download/ 永远指向最新 Release 的同名资产，所以不用改代码）
#
# 怎么发一版：打个 tag 推上去就行
#   git tag dict-2026.09 && git push origin dict-2026.09
#
# 也可以手动跑（Actions 页面 → 词库 → Run workflow），这时会更新一个叫 dict-latest 的 tag。
name: 词库

on:
  push:
    tags: ["dict-*"]
  workflow_dispatch:

permissions:
  contents: write # 发 Release 要写权限

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 自检那一步要真的跑一遍 `pliers`（用发布版能打开的词库才算合格），
      # 而 pliers-ime 会链接 libxkbcommon —— Ubuntu runner 上默认没有这个开发包，
      # 少了它链接直接失败：`rust-lld: error: unable to find library -lxkbcommon`。
      # zstd / jq 是压缩资产和查语料版本用的（runner 一般自带，写在这儿不怕镜像变）
      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev zstd jq sqlite3

      - uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: dict-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      # 语料：白霜拼音 rime-frost（GPL-3.0）。字频词频是拿 7.4 亿字语料统计的，
      # 多音字一行一个读音 —— 正好是 `词<TAB>拼音<TAB>权重`，直接就能导
      - name: 下载语料
        run: |
          mkdir -p corpus
          for f in 8105 41448 base ext tencent others; do
            curl -fsSL -o "corpus/$f.dict.yaml" \
              "https://raw.githubusercontent.com/gaboolic/rime-frost/master/cn_dicts/$f.dict.yaml"
          done
          echo "语料行数：$(cat corpus/*.dict.yaml | wc -l)"
          # 带上 token：不带的话 runner 的共享 IP 偶尔会撞上 GitHub 的匿名限流，
          # 语料版本就会记成空（Release 说明里那一栏靠它）
          echo "CORPUS_SHA=$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/gaboolic/rime-frost/commits/master | jq -r .sha)" >> "$GITHUB_ENV"

      - name: 构建
        run: cargo run --release -p pliers-dict -- --rime corpus --out pinyin.db

      # 英文词表：上游 en_50k（OpenSubtitles 词频）+ 我们自己那份开发词表，
      # 由 tools/build_english_list.py 合成，再用 pliers-dict 导成 english.db。
      # 跟拼音词库分开打包，可以单独更新
      - name: 构建英文词表
        run: |
          curl -fsSL -o en_50k.txt \
            "https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2018/en/en_50k.txt"
          python3 tools/build_english_list.py --source en_50k.txt --out english.txt
          test "$(grep -c '^[a-z]' english.txt)" -gt 20000
          # 跟仓库里那份比一比：不一样说明上游词频表变了，提醒一句（不算失败）
          if ! diff -q english.txt crates/pliers-engine/data/english.txt >/dev/null; then
            echo "::warning::生成的词表跟仓库里那份不一样（上游数据更新了？）—— 想同步就重跑一次脚本并提交"
          fi
          cargo run --release -p pliers-dict -- --english english.txt --out english.db
          # 自包含：写完必须没有待并回的 WAL，否则压缩出来的库是空的
          if [ -f english.db-wal ] && [ -s english.db-wal ]; then
            echo "::error::english.db-wal 还有数据，压缩出来会是个空库"
            exit 1
          fi
          test "$(sqlite3 english.db 'select count(*) from english')" -gt 20000

      # 发布前自检：词库得是**自包含**的一个文件（导入程序最后会把 WAL 并回主库），
      # 而且要能被 pliers 正常打开 —— 这一步能挡住"资产里少了一半数据"这种事
      - name: 自检
        run: |
          # WAL 文件的前 32 字节是文件头：只有头、没有帧 = 没有"还没并回主库的数据"。
          # 不能只看"文件非空"—— 打开过一次就会留下这个头（turso 也这样）
          if [ -f pinyin.db-wal ] && [ "$(stat -c%s pinyin.db-wal)" -gt 32 ]; then
            echo "::error::pinyin.db-wal 里有数据帧，说明没 checkpoint，发布出去会是个残缺的库"
            exit 1
          fi
          PLIERS_PINYIN="$PWD/pinyin.db" cargo run --release -p pliers-ime -- status pinyin | tee /tmp/status.txt
          grep -q "词条" /tmp/status.txt

      - name: 压缩 + 记指纹
        run: |
          # 自检那一步用 pliers 打开过词库，会留下一个只有头的 -wal（数据都在主库里）。
          # 这里正式 checkpoint 一次：万一旁边的 -wal 里真有帧，也一并并回主库，
          # 然后要求它归零 —— 资产必须是自包含的一个文件
          sqlite3 pinyin.db "PRAGMA wal_checkpoint(TRUNCATE);"
          if [ -f pinyin.db-wal ] && [ -s pinyin.db-wal ]; then
            echo "::error::checkpoint 之后 pinyin.db-wal 还有数据，压缩出来会是个残缺的库"
            exit 1
          fi
          rm -f pinyin.db-wal pinyin.db-shm english.db-wal english.db-shm
          zstd -19 -T0 pinyin.db -o pinyin.db.zst
          zstd -19 -T0 english.db -o english.db.zst
          sha256sum pinyin.db.zst > pinyin.db.zst.sha256
          sha256sum english.db.zst > english.db.zst.sha256
          ls -l pinyin.db pinyin.db.zst english.db english.db.zst
          cat pinyin.db.zst.sha256 english.db.zst.sha256

      # 许可：词库是从 GPL-3.0 的语料构建出来的衍生作品，发出来就得随附许可和来源
      #（来源就是 rime-frost 仓库本身 + 这个工作流，谁都拿得到）
      - name: 写 Release 说明
        run: |
          cat > release-body.md <<EOF
          拼音词库，给 [pliers](https://github.com/${{ github.repository }}) 用。

          \`\`\`
          pliers --init          # 自动下载安装（就是拿这里的 pinyin.db.zst）
          \`\`\`

          | | |
          | --- | --- |
          | 语料 | [白霜拼音 rime-frost](https://github.com/gaboolic/rime-frost)（GPL-3.0） |
          | 语料版本 | \`$CORPUS_SHA\` |
          | 构建方式 | \`pliers-dict --rime corpus --out pinyin.db\`（见 \`.github/workflows/dict.yml\`） |
          | 许可 | **GPL-3.0**（本资产是上述语料的衍生作品） |

          同一个 Release 里还有 **`english.db.zst`**（英文候选词表，SQLite，约 500 KB），
          来源 [FrequencyWords](https://github.com/hermitdave/FrequencyWords) 的 `en_50k`
          （OpenSubtitles2018 词频，CC-BY-SA-4.0）+ 仓库里 \`tools/english-extra.txt\`
          那份开发常用词。它跟词库**分开**，可以单独更新：

          \`\`\`
          pliers fetch english     # 只更新词表，不用重装输入法
          \`\`\`

          **五笔这类码表没有资产**（各家的码不一样、许可也各不相同）：用自己的码表建一份，
          落到它自己的 \`wubi.db\` 里 —— 跟拼音词库互不影响：

          \`\`\`
          pliers build wubi 我的五笔.txt     # 每行 `词<TAB>码[<TAB>权重]`
          \`\`\`

          词条是 \`词 + 拼音 + 权重\`，多音字一行一个读音。想自己构建（不用这个资产）：

          \`\`\`
          pliers build pinyin
          \`\`\`
          EOF
          cat release-body.md

      - name: 发到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'dict-latest' }}
          name: 词库 ${{ github.ref_type == 'tag' && github.ref_name || 'dict-latest' }}
          body_path: release-body.md
          files: |
            pinyin.db.zst
            pinyin.db.zst.sha256
            english.db.zst
            english.db.zst.sha256

      # 拼音词库以前叫 dict.db（跟 wubi.db / english.db 不齐），现在统一成 pinyin.db。
      # 老名字那两个资产留在 Release 上的话会跟新的混着（有人照着旧文档下），顺手删掉
      - name: 删掉老名字的资产
        if: ${{ github.ref_type != 'tag' }}
        run: |
          tag=dict-latest
          for name in dict.db.zst dict.db.zst.sha256; do
            id=$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag" \
              | jq -r --arg name "$name" '.assets[] | select(.name == $name) | .id' | head -1)
            if [ -n "$id" ]; then
              curl -fsSL -X DELETE -H "Authorization: Bearer ${{ github.token }}" \
                "https://api.github.com/repos/${{ github.repository }}/releases/assets/$id"
              echo "删掉了老资产 $name"
            fi
          done
