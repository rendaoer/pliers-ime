[package]
name = "pliers-wayland"
description = "Wayland 协议层：以输入法身份注册、抓键盘、转发按键、贴候选框"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
wayland-client.workspace = true
wayland-protocols-misc.workspace = true
xkbcommon.workspace = true
pliers-engine.workspace = true
pliers-popup.workspace = true
# poll(2)：主循环要同时等 Wayland socket 和命令 socket
libc = "0.2"
# 托盘图标（StatusNotifierItem）：Noctalia / waybar 这类 tray 会自动收。
# 只用 blocking 那套 API，不带 tokio。
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
